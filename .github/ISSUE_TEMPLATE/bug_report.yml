name: Bug report
description: Report a problem with command rewriting or plugin loading
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets or full commands that contain credentials.
        For security issues, follow SECURITY.md instead of opening an issue.
  - type: input
    id: opencode-version
    attributes:
      label: OpenCode version
      placeholder: "2.1.1"
    validations:
      required: true
  - type: input
    id: rtk-version
    attributes:
      label: RTK version
      description: Output of `rtk --version`
      placeholder: "rtk 0.49.0"
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Ubuntu 24.04, macOS 15, Windows 11"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the behavior without pasting secrets.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Plugin configuration
      description: Redact paths, tokens, and private information.
      render: jsonc
  - type: textarea
    id: logs
    attributes:
      label: Debug output
      description: 'Output with `"debug": true`, if available. Commands are not logged by the plugin.'
      render: text
